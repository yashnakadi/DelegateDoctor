[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delegate-doctor"
version = "0.1.0"
description = "Find and repair expensive ExecuTorch/XNNPACK fallback operations on Arm64"
readme = "README.md"
license = { file = "LICENSE" }

# Python 3.12 only. The whole project was developed and validated on 3.12.7,
# and the upper bound is deliberate: on newer interpreters the ExecuTorch and
# PyTorch stack emits compatibility warnings we have not investigated. A hard
# bound gives a clear pip error instead of a subtly different environment.
requires-python = ">=3.12,<3.13"

# Pinned to the exact stack this project was validated against.
# executorch 1.4.0 pulls torch 2.13.0 itself, and that is the whole of the
# core runtime requirement: DelegateDoctor analyzes an ExportedProgram and has
# no model zoo of its own.
dependencies = [
    "executorch==1.4.0",

    # ExecuTorch pulls both of these transitively, but with no floor - and the
    # pair has a binary interface between them. pandas built against NumPy 1.x
    # running on NumPy 2.x raises `numpy.core.multiarray failed to import`, and
    # it raises it inside `executorch.devtools.Inspector`, which is to say
    # after a model has been exported, lowered, pushed to a device and
    # profiled. These floors make that combination unresolvable rather than
    # leaving it for the user to diagnose from the wreckage.
    #
    # pandas 2.2.2 is the first release with NumPy 2 support. NumPy 1.26 is the
    # first with a stable ABI for 3.12. Floors rather than pins: within these
    # bounds pip picks a mutually-built pair, which is what a clean virtual
    # environment does anyway.
    "numpy>=1.26",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
ai = [
    "litellm==1.96.2",
]
# Optional bring-your-own-key AI assistance. LiteLLM is the provider transport
# only - DelegateDoctor ships no key, owns no account and funds no inference.
# Pinned rather than ranged: LiteLLM moves quickly, and this is the version the
# provider adapter was written and tested against.
# There is no credential dependency: DelegateDoctor does not store API keys.
# The user supplies one through the environment when they want AI.


# The demonstration scripts in examples/ build real models, so they need real
# model libraries. The core package imports none of these - a regression test
# asserts that - which is why they are an extra rather than a dependency.
examples = [
    "torchvision==0.28.0",
    "segmentation_models_pytorch==0.5.0",
]
# The test suite only.
dev = [
    "pytest>=8.0",
]

# Everything a user of the full experience needs, in one name.
all = [
    "delegate-doctor[ai,examples]",
]

[project.scripts]
delegate-doctor = "delegate_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["delegate_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
