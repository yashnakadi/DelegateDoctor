[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delegate-doctor"
version = "0.1.0"
description = "Find and repair expensive ExecuTorch/XNNPACK fallback operations on Arm64"
readme = "README.md"
license = { file = "LICENSE" }

# Python 3.12 only. The whole project was developed and validated on 3.12.7,
# and the upper bound is deliberate: on newer interpreters the ExecuTorch and
# PyTorch stack emits compatibility warnings we have not investigated. A hard
# bound gives a clear pip error instead of a subtly different environment.
requires-python = ">=3.12,<3.13"

# Pinned to the exact stack this project was validated against.
# executorch 1.4.0 pulls torch 2.13.0 itself, and that is the whole of the
# core runtime requirement: DelegateDoctor analyzes an ExportedProgram and has
# no model zoo of its own.
dependencies = [
    "executorch==1.4.0",
]

[project.optional-dependencies]
# The demonstration scripts in examples/ build real models, so they need real
# model libraries. The core package imports none of these - a regression test
# asserts that - which is why they are an extra rather than a dependency.
examples = [
    "torchvision==0.28.0",
    "segmentation_models_pytorch==0.5.0",
]
# The test suite only. DelegateDoctor itself has no optional backends: no AI,
# no remote services, no credentials.
dev = [
    "pytest>=8.0",
]

[project.scripts]
delegate-doctor = "delegate_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["delegate_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
